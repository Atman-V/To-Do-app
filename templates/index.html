<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="board">

  <header class="board-header">
    <div class="header-title">
      <h1>Task Board</h1>
      <p class="subtitle">track what's pending, ship what's done</p>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">total</span></div>
      <div class="stat"><span class="stat-value" id="stat-pending">0</span><span class="stat-label">pending</span></div>
      <div class="stat"><span class="stat-value" id="stat-done">0</span><span class="stat-label">completed</span></div>
    </div>
  </header>

  <section class="composer">
    <form id="task-form">
      <input type="text" id="input-title" placeholder="Task name" required maxlength="200">
      <input type="text" id="input-description" placeholder="Description (optional)">
      <select id="input-priority">
        <option value="Low">Low</option>
        <option value="Medium" selected>Medium</option>
        <option value="High">High</option>
      </select>
      <button type="submit">Add task</button>
    </form>
    <p class="error" id="form-error"></p>
  </section>

  <nav class="filters" id="filters">
    <button class="filter-btn active" data-filter="All">All</button>
    <button class="filter-btn" data-filter="Pending">Pending</button>
    <button class="filter-btn" data-filter="Completed">Completed</button>
  </nav>

  <main class="task-list" id="task-list">
    <p class="empty-state" id="empty-state">No tasks yet. Add one above to get started.</p>
  </main>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
